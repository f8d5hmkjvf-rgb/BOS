# AI HQ — PostgreSQL + application + worker (+ Caddy en option pour un serveur public).
#
#   Sur votre ordinateur (gratuit, aucun achat) :   docker compose up -d --build
#      → http://localhost:3000 ; accès téléphone en HTTPS via Tailscale (docs/HEBERGEMENT.md)
#   Plus tard, sur un serveur avec un domaine :       docker compose --profile public up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aihq
      POSTGRES_USER: aihq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis dans .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aihq -d aihq"]
      interval: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://aihq:${POSTGRES_PASSWORD}@db:5432/aihq
    # Exposé uniquement sur la machine elle-même : l'accès distant passe par Tailscale ou Caddy (HTTPS).
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      db: { condition: service_healthy }

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://aihq:${POSTGRES_PASSWORD}@db:5432/aihq
    command: ["npx", "tsx", "scripts/worker.ts"]
    # Le worker ne sert pas HTTP : sa santé est suivie par son battement de cœur en base (/api/status).
    healthcheck: { disable: true }
    depends_on:
      db: { condition: service_healthy }

  caddy:
    profiles: ["public"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]

volumes:
  pgdata:
  caddy_data:
