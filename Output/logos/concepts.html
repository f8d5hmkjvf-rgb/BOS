<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#eee;font-family:Jost,sans-serif}
.grid{display:grid;grid-template-columns:repeat(3,420px);gap:0}
.c{height:420px;display:flex;align-items:center;justify-content:center;position:relative}
.cream{background:#F3EDE4;color:#1C1A18}.dark{background:#1C1A18;color:#F3EDE4}
.lab{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:13px;letter-spacing:.2em;opacity:.55}
svg text{font-family:'Cormorant Garamond',serif}
</style></head><body><div class="grid">
<!-- Concept 1 : anneau -->
<div class="c cream"><svg width="300" height="300" viewBox="0 0 300 300">
<circle cx="150" cy="150" r="120" fill="none" stroke="#1C1A18" stroke-width="1.5"/>

</svg><div class="lab">1 · L'ANNEAU</div></div>
<div class="c cream"><svg width="300" height="300" viewBox="0 0 300 300">

</svg><div class="lab">2 · LA BRAISE</div></div>
<div class="c dark"><svg width="300" height="300" viewBox="0 0 300 300">

<text x="150" y="200" text-anchor="middle" font-size="96" font-weight="300" fill="#F3EDE4">aro</text>
<line x1="110" y1="225" x2="190" y2="225" stroke="#C2703D" stroke-width="1"/>
