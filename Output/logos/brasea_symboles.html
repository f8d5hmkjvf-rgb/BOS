<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
body{margin:0}
.g{display:grid;grid-template-columns:repeat(3,600px)}
.c{height:600px;display:flex;align-items:center;justify-content:center;position:relative;flex-direction:column;background:#F3EDE4;color:#161412}
.lab{position:absolute;bottom:18px;width:100%;text-align:center;font:13px Jost;letter-spacing:.3em;opacity:.45;text-transform:uppercase}
.s{font-family:'Cormorant Garamond',serif}
.big{width:200px;height:200px;display:flex;align-items:center;justify-content:center;position:relative}
.small{display:flex;gap:28px;align-items:center;margin-top:46px}
.pill{width:64px;height:64px;border-radius:50%;background:#161412;display:flex;align-items:center;justify-content:center;color:#F3EDE4;overflow:hidden}
.ring{border:1px solid currentColor;border-radius:50%}
.rust{color:#A44A22}
</style></head><body><div class="g">

<!-- S1 sceau Mb -->
<div class="c">
 <div class="big ring"><div style="position:absolute;inset:9px" class="ring" ></div><div class="s" style="font-size:104px;font-weight:300;letter-spacing:-.06em;line-height:1">M<span class="rust" style="font-style:italic">b</span></div></div>
 <div class="small"><div class="pill"><div class="s" style="font-size:32px;font-weight:300;letter-spacing:-.06em">M<i style="color:#C9703F">b</i></div></div><div class="s" style="font-size:22px;letter-spacing:-.06em">M<i class="rust">b</i></div></div>
 <div class="lab">S1 · Le sceau Mb</div>
</div>

<!-- S2 MB capitales séparées -->
<div class="c">

 <div class="small"><div class="pill"><div class="s" style="font-size:24px;display:flex;align-items:center;gap:5px">M<span style="width:1px;height:22px;background:#C9703F;display:inline-block"></span>B</div></div><div class="s" style="font-size:22px;display:flex;align-items:center;gap:4px">M<span style="width:1px;height:20px;background:#A44A22;display:inline-block"></span>B</div></div>

</div>

<!-- S3 B braise -->
<div class="c">

 <div class="small"><div class="pill"><div class="s" style="font-size:40px;font-weight:300;position:relative;line-height:1">B<span style="position:absolute;right:-6px;top:5px;width:6px;height:6px;border-radius:50%;background:#C9703F"></span></div></div><div class="s" style="font-size:26px;position:relative;line-height:1">B<span style="position:absolute;right:-5px;top:3px;width:4px;height:4px;border-radius:50%;background:#A44A22"></span></div></div>
 <div class="lab">S3 · Le B braise</div>
</div>

<!-- S4 brasero vu du ciel -->

 <div class="lab">S5 · La flamme</div>
</div>

<!-- S6 losange MB -->
<div class="c">
 <div class="big"><div style="position:absolute;width:140px;height:140px;border:1px solid #161412;transform:rotate(45deg)"></div><div style="position:absolute;width:126px;height:126px;border:1px solid rgba(22,20,18,.35);transform:rotate(45deg)"></div><div class="s" style="font-size:52px;font-weight:400;letter-spacing:.04em;position:relative">M<span class="rust">·</span>B</div></div>
 <div class="small"><div class="pill"><div class="s" style="font-size:22px">M<span style="color:#C9703F">·</span>B</div></div><div class="s" style="font-size:20px">M<span class="rust">·</span>B</div></div>

</div>
</div></body></html>
